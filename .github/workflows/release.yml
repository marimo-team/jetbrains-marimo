# GitHub Actions Workflow that publishes a release, triggered by hand from the Actions tab.
#
# The version comes from gradle.properties and the notes from the matching CHANGELOG.md section,
# both landed by the release pull request; see CONTRIBUTING.md "Releasing" for the runbook.
# Nothing is tagged until the Marketplace has accepted the plugin: the final step creates the tag,
# the GitHub release, and the asset together, so a failed publish leaves no trace to clean up.
#
# Run with 'dry_run' enabled (the default) to build the plugin and preview the exact release notes
# without publishing anything.
#
# Running the publishPlugin task requires all the following secrets to be provided: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build and preview the release notes without publishing"
        required: true
        default: true
        type: boolean

permissions: {}

jobs:

  # Cheap checks first, outside the 'release' environment, so an unbumped version fails
  # immediately without waiting on approval and without the publishing secrets in scope.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Read Version
        id: version
        run: |
          VERSION=$(grep -m1 -E '^version[[:space:]]*=' gradle.properties | sed -E 's/.*=[[:space:]]*//')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read 'version' from gradle.properties"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Release $VERSION (dry run: ${{ inputs.dry_run }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Assert Version Not Already Released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Version $VERSION is already released. Bump 'version' in gradle.properties first."
            exit 1
          fi

  # Builds the plugin and renders the notes in both modes, so a dry run proves the release
  # would succeed and shows exactly what would ship. The notes are passed to the publish job
  # as an artifact, so what you preview is what gets published.
  preview:
    name: Build and Preview Notes
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Build Plugin
        run: ./gradlew buildPlugin

      # Fails when CHANGELOG.md has no section for this version, which is the mistake most
      # likely to be caught here rather than halfway through a real release.
      - name: Render Release Notes
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          ./gradlew getChangelog --project-version "$VERSION" --no-header --quiet --console=plain --output-file="$RELEASE_NOTE"

          if [ ! -s "$RELEASE_NOTE" ]; then
            echo "::error::CHANGELOG.md section for $VERSION is empty"
            exit 1
          fi

          {
            echo "#### Release notes"
            echo
            cat "$RELEASE_NOTE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release Notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-note
          path: build/tmp/release_note.txt

      - name: Upload Plugin Archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-archive
          path: build/distributions/*

  # Publish the plugin to JetBrains Marketplace, then tag and announce it.
  publish:
    name: Publish Plugin
    if: ${{ inputs.dry_run == false }}
    needs: [preflight, preview]
    runs-on: ubuntu-latest
    # Scopes the publishing/signing secrets to this job and gates it behind the environment's
    # protection rules (configure required reviewers on the 'release' environment for manual approval).
    environment: release
    permissions:
      contents: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      # Reuse the notes the preview job rendered, so the published release matches the preview
      - name: Download Release Notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-note
          path: build/tmp

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -Ptelemetry.env=production

      # Creates the tag, the release, and the asset in one step, only after the Marketplace
      # has accepted the plugin. A failed publish therefore leaves nothing to undo.
      - name: Tag and Create GitHub Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          URL=$(gh release create "$VERSION" \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --notes-file ./build/tmp/release_note.txt \
            ./build/distributions/*)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Notify Slack about the release outcome
      - name: Notify Slack - Release Success
        if: success()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_RELEASES }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ Release completed successfully for jetbrains-marimo",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Release successful*\n\n*Repository:* jetbrains-marimo\n*Version:* ${{ needs.preflight.outputs.version }}\n*Release:* <${{ steps.release.outputs.url }}|${{ needs.preflight.outputs.version }}>\n*Marketplace:* https://plugins.jetbrains.com/plugin/index?xmlId=io.marimo.notebook"
                  }
                }
              ]
            }

      - name: Notify Slack - Release Failed
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_RELEASES }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ Release failed for jetbrains-marimo",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Release failed*\n\n*Repository:* jetbrains-marimo\n*Version:* ${{ needs.preflight.outputs.version }}\n*Commit:* <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Triggered by:* ${{ github.actor }}\n*Workflow:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
