name: 🏷️ Enforce Pull Request Label

# Every pull request must declare a category; scripts/release_changes.py groups
# release notes by these labels, so an unlabeled pull request cannot be placed.

on:
  pull_request:
    types: [labeled, unlabeled, opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  enforce-label:
    runs-on: ubuntu-latest
    steps:
      - uses: yogevbd/enforce-label-action@a3c219da6b8fa73f6ba62b68ff09c469b3a1c024 # 2.2.2
        with:
          REQUIRED_LABELS_ANY: "enhancement,bug,documentation,internal,preview,dependencies,other,breaking"
          REQUIRED_LABELS_ANY_DESCRIPTION: "🏷️ Select at least one label: ['enhancement','bug','documentation','internal','preview','dependencies','other','breaking']"
