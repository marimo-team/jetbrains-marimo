sessions.settings.token.checkbox=Require an access token for notebook servers
sessions.settings.token.note=The plugin generates a token per launch and passes it via a temp file. Turn off only to debug connection problems on older marimo versions; without a token, any local process can reach the notebook server.
sessions.settings.ttl.label=Keep a closed notebook''s server running (minutes):
sessions.settings.ttl.validation=Enter a whole number from 1 to 720 minutes.
sessions.settings.ttl.note=After the last tab of a notebook closes, its marimo server keeps running for this long so reopening reconnects instantly (minimum 1 minute). Stop a server at any time from the marimo Sessions tool window.
