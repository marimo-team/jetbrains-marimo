group = io.marimo.notebook
version = 0.1.2

pluginRepositoryUrl = https://github.com/marimo-team/jetbrains-marimo

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# The bundled Vue plugin throws from its static initializer when it loads in a test IDE, and
# the platform test framework turns that logged error into a test failure. Keep it off the
# test classpath. Remove this line when WEB-78747 is fixed.
# https://youtrack.jetbrains.com/issue/WEB-78747
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes = org.jetbrains.plugins.vue
